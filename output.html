<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HVFT VISION — OUTPUT</title>
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; cursor:none;
    font-family:'JetBrains Mono',ui-monospace, Menlo, monospace; }
  #view { position:absolute; inset:0; width:100%; height:100%; z-index:0; visibility:hidden; }
  #map  { position:absolute; inset:0; width:100%; height:100%; z-index:1; display:block; }
  body.edit { cursor:default; }
  .handle { position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px; border:3px solid #F2A03D;
    border-radius:50%; background:#F2A03D33; box-shadow:0 0 0 1px #000, 0 0 14px #000a; z-index:3; display:none; cursor:grab; }
  .handle::before, .handle::after { content:''; position:absolute; background:#F2A03D; }
  .handle::before { left:50%; top:7px; bottom:7px; width:2px; margin-left:-1px; }
  .handle::after { top:50%; left:7px; right:7px; height:2px; margin-top:-1px; }
  .handle.selc { background:#F2A03D77; border-color:#fff; box-shadow:0 0 0 2px #fff, 0 0 18px #F2A03D; }
  .handle b { position:absolute; left:54px; top:10px; color:#F2A03D;
    font:700 14px 'Orbitron','Audiowide', ui-monospace, Menlo, monospace; letter-spacing:.1em;
    background:#000b; padding:3px 8px; white-space:nowrap;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px); }
  body.edit .handle { display:block; }
  /* brand watermark while editing */
  #obrand { position:absolute; right:16px; bottom:12px; z-index:4; display:none; align-items:baseline; gap:.5rem;
    color:#F2A03D; opacity:.85; pointer-events:none; }
  #obrand .h { font:900 20px 'Orbitron','Audiowide', ui-monospace, monospace; letter-spacing:.05em; transform:skewX(-12deg); }
  #obrand .s { font:700 9px 'Orbitron','Audiowide', ui-monospace, monospace; letter-spacing:.5em; color:#8A8A8A; }
  body.edit #obrand { display:flex; }
  #maptip { position:absolute; left:14px; top:12px; color:#E8E8E8; z-index:4; display:none;
    font:600 13px/1.6 ui-monospace, Menlo, monospace; letter-spacing:.04em;
    background:#0A0A0Aee; padding:10px 12px; border:1px solid #F2A03D; max-width:70%;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px); }
  #maptip b { color:#F2A03D; font-family:'Orbitron','Audiowide',ui-monospace,monospace; font-weight:700; letter-spacing:.14em; }
  body.edit #maptip { display:block; }
  #maptools { position:absolute; left:14px; top:82px; z-index:6; display:none; gap:8px; flex-wrap:wrap; max-width:70%; }
  body.edit #maptools { display:flex; }
  #maptools button { font:700 14px 'Orbitron','Audiowide', ui-monospace, Menlo, monospace; letter-spacing:.1em;
    color:#0A0A0A; background:#F2A03D; border:none; padding:10px 15px; cursor:pointer;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
  #maptools button:hover { background:#FFC47A; }
  #maptools button:active { background:#fff; }
</style>
  <link rel="stylesheet" href="hud_fonts.css">
  <link rel="stylesheet" href="fonts.css">

<body>
  <canvas id="view"></canvas>

    <button data-mt="m">DONE</button>
  </div>
